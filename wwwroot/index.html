<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Search Engine</title>
  <!-- Tailwind CSS (CDN build — perfect for a self-contained local app) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Small custom layer: <mark> highlight + smooth dropdown animation */
    mark { background: #fde047; color: #422006; border-radius: 3px; padding: 0 2px; font-weight: 600; }
    .fade-in { animation: fadeIn .18s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
    ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-thumb { background: #334155; border-radius: 8px; }
  </style>
</head>

<body class="min-h-screen bg-slate-950 text-slate-200 antialiased">
<div class="mx-auto max-w-3xl px-4 pb-24">

  <!-- ─────────────────────────── Header / brand ─────────────────────────── -->
  <header class="pt-14 pb-8 text-center">
    <h1 class="text-5xl font-bold tracking-tight">
      <span class="text-indigo-400">Mini</span><span class="text-white">Search</span>
      <span class="align-super text-xs font-normal text-slate-500">.txt engine</span>
    </h1>
    <p class="mt-3 text-sm text-slate-400">
      Inverted Index &nbsp;·&nbsp; Trie autocomplete &nbsp;·&nbsp; live latency benchmarks
    </p>
  </header>

  <!-- ────────────────────── Indexing panel (folder + status) ───────────────────── -->
  <section id="indexCard" class="mb-6 rounded-2xl border border-slate-800 bg-slate-900/70 p-4 shadow-xl">
    <div class="flex flex-col gap-3 sm:flex-row">
      <input id="folderInput" type="text"
             placeholder="Folder of .txt files (empty = ./documents)"
             class="flex-1 rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm
                    text-slate-200 placeholder-slate-600 outline-none focus:border-indigo-500" />
      <button id="indexBtn"
              class="rounded-lg bg-indigo-600 px-5 py-2 text-sm font-semibold text-white
                     transition hover:bg-indigo-500 active:scale-[.98]">
        Index folder
      </button>
    </div>
    <div id="indexStatus" class="mt-3 hidden rounded-lg px-3 py-2 text-sm"></div>
  </section>

  <!-- ──────────────────────── Corpus stats (live) ──────────────────────── -->
  <section class="mb-6 grid grid-cols-2 gap-3 sm:grid-cols-4">
    <div class="rounded-xl border border-slate-800 bg-slate-900/70 p-3 text-center">
      <div id="statFiles" class="text-2xl font-bold text-indigo-300">–</div>
      <div class="text-xs uppercase tracking-wide text-slate-500">Files</div>
    </div>
    <div class="rounded-xl border border-slate-800 bg-slate-900/70 p-3 text-center">
      <div id="statWords" class="text-2xl font-bold text-emerald-300">–</div>
      <div class="text-xs uppercase tracking-wide text-slate-500">Unique words</div>
    </div>
    <div class="rounded-xl border border-slate-800 bg-slate-900/70 p-3 text-center">
      <div id="statTokens" class="text-2xl font-bold text-amber-300">–</div>
      <div class="text-xs uppercase tracking-wide text-slate-500">Tokens</div>
    </div>
    <div class="rounded-xl border border-slate-800 bg-slate-900/70 p-3 text-center">
      <div id="statBuildMs" class="text-2xl font-bold text-rose-300">–</div>
      <div class="text-xs uppercase tracking-wide text-slate-500">Index ms</div>
    </div>
  </section>

  <!-- ───────────────────── Search box + autocomplete dropdown ──────────────────── -->
  <section class="relative z-10 mb-4">
    <div class="flex gap-2">
      <div class="relative flex-1">
        <input id="searchBox" type="text" autocomplete="off" spellcheck="false"
               placeholder='Try "algorithm"  ·  "graph sorting" (AND)  ·  "graph or tree" (OR)'
               class="w-full rounded-full border border-slate-700 bg-slate-900 px-6 py-4
                      text-lg text-white placeholder-slate-600 shadow-2xl outline-none
                      transition focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/20" />
        <!-- Trie-powered suggestions, shown while typing -->
        <div id="suggestBox"
             class="absolute left-4 right-4 top-full z-20 mt-2 hidden overflow-hidden
                    rounded-xl border border-slate-700 bg-slate-900 shadow-2xl"></div>
      </div>
      <select id="modeSelect"
              class="rounded-full border border-slate-700 bg-slate-900 px-4 text-sm text-slate-300
                     outline-none focus:border-indigo-500">
        <option value="and" selected>AND</option>
        <option value="or">OR</option>
      </select>
      <button id="searchBtn"
              class="rounded-full bg-indigo-600 px-6 py-4 text-sm font-semibold text-white
                     transition hover:bg-indigo-500 active:scale-[.98]">
        Search
      </button>
    </div>
  </section>

  <!-- ─────────────────── Benchmark latency chips (live) ─────────────────── -->
  <section id="metrics" class="mb-6 hidden flex-wrap items-center gap-2 text-xs">
    <span id="metricSearch" class="rounded-full bg-slate-800 px-3 py-1 font-mono text-emerald-300"></span>
    <span id="metricMode"   class="rounded-full bg-slate-800 px-3 py-1 font-mono text-indigo-300"></span>
    <span id="metricCount"  class="rounded-full bg-slate-800 px-3 py-1 font-mono text-slate-300"></span>
  </section>

  <!-- ─────────────────────────── Results list ─────────────────────────── -->
  <section id="results" class="space-y-4"></section>

  <!-- Friendly empty / helper states -->
  <section id="placeholder" class="mt-16 text-center text-slate-600">
    <p class="text-6xl">🔎</p>
    <p class="mt-4 text-sm">Results with highlighted snippets will appear here.</p>
  </section>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   Mini Search Engine — frontend logic (vanilla JS)
   ───────────────────────────────────────────────────────────────────────────
   • auto-indexes ./documents on first load if the server has no index yet
   • debounced Trie autocomplete while typing (↑ ↓ Enter Esc supported)
   • renders server-highlighted snippets (<mark> tags arrive ready-made)
   • displays the exact Stopwatch latencies returned by every endpoint
   ═══════════════════════════════════════════════════════════════════════════ */

const $ = (id) => document.getElementById(id);
const searchBox   = $("searchBox"),   suggestBox = $("suggestBox");
const resultsBox  = $("results"),     placeholder = $("placeholder");
const metrics     = $("metrics");

let suggestItems = [];   // current dropdown entries
let activeIndex  = -1;   // keyboard-selected suggestion
let suggestSeq   = 0;    // guards against out-of-order autocomplete responses

/* ─────────────────────────────── helpers ─────────────────────────────── */

// Escape untrusted strings (doc names, paths) before innerHTML injection.
const esc = (s) => String(s).replace(/[&<>"']/g,
  (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

const ms = (v) => (v == null ? "–" : Number(v).toFixed(2) + " ms");

function showStatus(kind, text) {
  const el = $("indexStatus");
  el.className = "mt-3 rounded-lg px-3 py-2 text-sm " + (
    kind === "ok"   ? "bg-emerald-500/10 text-emerald-300" :
    kind === "err"  ? "bg-rose-500/10 text-rose-300"       :
                      "bg-slate-800 text-slate-300");
  el.textContent = text;
  el.classList.remove("hidden");
}

/* ──────────────────────────── stats + auto-index ──────────────────────────── */

async function loadStats() {
  try {
    const stats = await (await fetch("/api/stats")).json();
    $("statFiles").textContent   = stats.isIndexed ? stats.totalFiles   : "–";
    $("statWords").textContent   = stats.isIndexed ? stats.uniqueWords  : "–";
    $("statTokens").textContent  = stats.isIndexed ? stats.totalTokens  : "–";
    $("statBuildMs").textContent = stats.isIndexed ? ms(stats.indexTimeMs) : "–";

    // First-run convenience: index the default folder automatically.
    if (!stats.isIndexed) await indexFolder("");
  } catch (e) {
    showStatus("err", "Cannot reach the API — is the server running?");
  }
}

/* ─────────────────────────────── indexing ─────────────────────────────── */

async function indexFolder(folder) {
  $("indexBtn").disabled = true;
  showStatus("busy", "Indexing…");
  try {
    const url = folder ? "/api/index?folder=" + encodeURIComponent(folder) : "/api/index";
    const res = await fetch(url, { method: "POST" });
    const data = await res.json();

    if (data.success) {
      showStatus("ok",
        `Indexed ${data.filesIndexed} file(s) from ${data.folderPath} — ` +
        `${data.uniqueWords} unique words, ${data.tokensIndexed} tokens, in ${ms(data.indexTimeMs)}`);
    } else {
      showStatus("err", "Indexing failed: " + data.error);
    }
  } catch (e) {
    showStatus("err", "Indexing request failed: " + e.message);
  }
  $("indexBtn").disabled = false;
  await loadStats();
}

$("indexBtn").addEventListener("click", () => indexFolder($("folderInput").value.trim()));

/* ───────────────────────── autocomplete (Trie) ───────────────────────── */

function renderSuggestions(data) {
  suggestItems = data.suggestions || [];
  activeIndex  = -1;

  if (!suggestItems.length) { suggestBox.classList.add("hidden"); return; }

  suggestBox.innerHTML = suggestItems.map((s, i) => `
    <div data-i="${i}"
         class="suggestion cursor-pointer px-5 py-2.5 text-sm hover:bg-slate-800
                flex items-center justify-between">
      <span class="text-slate-200"><b class="text-indigo-300">${esc(data.prefix)}</b>${esc(s.word.slice(data.prefix.length))}</span>
      <span class="ml-4 font-mono text-xs text-slate-500">${s.frequency}× in corpus</span>
    </div>`).join("");
  suggestBox.classList.remove("hidden");

  // Click (and mouse-over) selection.
  suggestBox.querySelectorAll(".suggestion").forEach((el) => {
    el.addEventListener("mousedown", (e) => {          // mousedown: before input blur
      e.preventDefault();
      chooseSuggestion(Number(el.dataset.i));
    });
  });
}

function chooseSuggestion(i) {
  if (i < 0 || i >= suggestItems.length) return;
  searchBox.value = suggestItems[i].word;
  hideSuggestions();
  runSearch();
}

function hideSuggestions() { suggestBox.classList.add("hidden"); activeIndex = -1; }

// Debounced: 120 ms after the last keystroke, query the Trie.
let typeTimer = null;
searchBox.addEventListener("input", () => {
  clearTimeout(typeTimer);
  const prefix = searchBox.value.trim();
  if (!prefix) { hideSuggestions(); return; }

  typeTimer = setTimeout(async () => {
    const seq = ++suggestSeq;                          // drop stale responses
    try {
      const data = await (await fetch("/api/autocomplete?prefix=" + encodeURIComponent(prefix))).json();
      if (seq === suggestSeq) renderSuggestions(data);
    } catch { /* server busy — ignore */ }
  }, 120);
});

// Keyboard navigation inside the dropdown.
searchBox.addEventListener("keydown", (e) => {
  const open = !suggestBox.classList.contains("hidden");
  if (e.key === "ArrowDown" && open) {
    e.preventDefault();
    activeIndex = (activeIndex + 1) % suggestItems.length;
  } else if (e.key === "ArrowUp" && open) {
    e.preventDefault();
    activeIndex = (activeIndex - 1 + suggestItems.length) % suggestItems.length;
  } else if (e.key === "Enter") {
    if (open && activeIndex >= 0) { chooseSuggestion(activeIndex); }
    else { hideSuggestions(); runSearch(); }
    return;
  } else if (e.key === "Escape") { hideSuggestions(); return; }
  else return;

  suggestBox.querySelectorAll(".suggestion").forEach((el, i) => {
    el.classList.toggle("bg-slate-800", i === activeIndex);
  });
});

document.addEventListener("click", (e) => {
  if (!suggestBox.contains(e.target) && e.target !== searchBox) hideSuggestions();
});

/* ──────────────────────────────── search ──────────────────────────────── */

async function runSearch() {
  const q = searchBox.value.trim();
  const mode = $("modeSelect").value;
  hideSuggestions();
  if (!q) return;

  try {
    const url = "/api/search?q=" + encodeURIComponent(q) + "&mode=" + mode;
    const data = await (await fetch(url)).json();
    renderResults(data);
  } catch (e) {
    resultsBox.innerHTML = "";
    placeholder.classList.remove("hidden");
    showStatus("err", "Search failed: " + e.message);
  }
}

$("searchBtn").addEventListener("click", runSearch);

function renderResults(data) {
  metrics.classList.remove("hidden");
  metrics.classList.add("flex");
  $("metricSearch").textContent = "search " + ms(data.searchTimeMs);
  $("metricMode").textContent   = "mode: " + data.mode.toUpperCase();
  $("metricCount").textContent  = data.totalMatches + " file(s) matched";

  if (!data.results.length) {
    resultsBox.innerHTML = `
      <div class="rounded-2xl border border-slate-800 bg-slate-900/70 p-8 text-center">
        <p class="text-4xl">🤷</p>
        <p class="mt-3 text-slate-400">No documents matched
           <b class="text-white">"${esc(data.query)}"</b>.</p>
        <p class="mt-1 text-sm text-slate-600">Check spelling, or try the OR mode.</p>
      </div>`;
    return;
  }

  // One card per matching document; <mark> snippets arrive pre-highlighted.
  resultsBox.innerHTML = data.results.map((r) => `
    <article class="fade-in rounded-2xl border border-slate-800 bg-slate-900/70 p-5
                    shadow-lg transition hover:border-slate-700">
      <div class="flex flex-wrap items-baseline justify-between gap-2">
        <h2 class="text-lg font-semibold text-indigo-300">📄 ${esc(r.documentName)}</h2>
        <span class="rounded-full bg-indigo-500/10 px-3 py-1 text-xs font-mono text-indigo-300">
          relevance ${r.relevanceScore} · ${r.occurrenceCount}×
        </span>
      </div>
      <p class="mt-1 font-mono text-xs text-slate-500">${esc(r.filePath)}</p>

      <div class="mt-3 flex flex-wrap gap-1.5">
        ${r.lineNumbers.map((n) =>
          `<span class="rounded bg-slate-800 px-2 py-0.5 text-xs text-slate-400">line ${n}</span>`
        ).join("")}
      </div>

      <div class="mt-3 space-y-2">
        ${r.snippets.map((s) =>
          `<p class="rounded-lg bg-slate-950/60 p-3 text-sm leading-relaxed text-slate-300">${s}</p>`
        ).join("") || '<p class="text-sm text-slate-600">(no preview window)</p>'}
      </div>
    </article>`).join("");
}

/* ─────────────────────────────── boot ─────────────────────────────── */

loadStats();
searchBox.focus();
</script>
</body>
</html>
